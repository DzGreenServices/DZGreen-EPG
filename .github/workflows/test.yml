name: Update beIN EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-bein-epg.txt
          python -m playwright install --with-deps chromium

      - name: Check Python syntax
        run: |
          python -u -m py_compile bein_epg.py
          echo "Python syntax check passed."

      - name: Generate EPG
        run: |
          echo "Starting beIN EPG scraper..."
          if python -u bein_epg.py; then
            echo "Scraper process completed successfully."
          else
            status=$?
            echo "ERROR: Scraper failed with exit code $status."
            exit "$status"
          fi

          echo "Checking generated files..."

          if [ ! -s docs/BeIN-EPG.xml ]; then
            echo "ERROR: BeIN-EPG.xml is missing or empty."
            exit 1
          fi

          if [ ! -s docs/BeIN-Channel-Mapping.csv ]; then
            echo "ERROR: BeIN-Channel-Mapping.csv is missing or empty."
            exit 1
          fi

          ls -lh docs/BeIN-EPG.xml docs/BeIN-Channel-Mapping.csv

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/BeIN-EPG.xml docs/BeIN-Channel-Mapping.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update beIN EPG"
            git push
          fi
