name: Update EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run ElCinema scraper
        run: python scraper.py

      - name: Run beIN scraper
        run: python bein_epg.py

      - name: Prepare GitHub Pages
        run: |
          mkdir -p docs

          cp ElCinema-EPG.xml docs/ElCinema-EPG.xml
          cp BeIN-EPG.xml docs/BeIN-EPG.xml

          cp ElCinema-Channel-Mapping.csv docs/ElCinema-Channel-Mapping.csv
          cp BeIN-Channels.csv docs/BeIN-Channels.csv

      - name: Save generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          git diff --cached --quiet || git commit -m "Update EPG"

          git push
