
name: Update ElCinema EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Check Python syntax
        run: |
          python -u -m py_compile scraper.py
          echo "scraper.py syntax check passed."

      - name: Generate ElCinema EPG
        run: |
          echo "Starting ElCinema scraper..."
          python -u scraper.py

      - name: Verify generated files
        run: |
          if [ ! -s docs/ElCinema-EPG.xml ]; then
            echo "ERROR: docs/ElCinema-EPG.xml is missing or empty."
            exit 1
          fi

          if [ ! -s docs/ElCinema-Channel-Mapping.csv ]; then
            echo "ERROR: docs/ElCinema-Channel-Mapping.csv is missing or empty."
            exit 1
          fi

          if ! grep -q "<programme " docs/ElCinema-EPG.xml; then
            echo "ERROR: XML contains no programme entries."
            exit 1
          fi

          echo "Generated files:"
          ls -lh docs/ElCinema-EPG.xml
          ls -lh docs/ElCinema-Channel-Mapping.csv

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/ElCinema-EPG.xml
          git add docs/ElCinema-Channel-Mapping.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ElCinema EPG"
            git push
          fi
